<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout | Harbor &amp; Pine Tea</title>
<style>
  :root { --accent: #1F5C4A; --ink: #1E2A28; --muted: #5E6B68; --panel: #F3F1EA; --line: #D9D4C7; }
  * { box-sizing: border-box; margin: 0; }
  body { font: 16px/1.5 Georgia, serif; color: var(--ink); background: #fff; }
  header { padding: 18px 32px; background: var(--accent); color: #fff; font: 700 22px/1 Georgia, serif; }
  main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 30px; }
  .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .small { color: var(--muted); font-size: 14px; margin-top: 12px; }
  button { margin-top: 24px; width: 100%; padding: 16px; border: 0; background: var(--accent); color: #fff; font: 700 18px/1 Georgia, serif; }
</style>
</head>
<body>
<header>Harbor &amp; Pine</header>
<main>
  <h1>Checkout</h1>
  <div class="row"><span>Sea Fog Green, 100 g</span><span>12.90 €</span></div>
  <div class="row"><span>Shipping</span><span>6.90 €</span></div>
  <div class="row"><b>Total</b><b>19.80 €</b></div>
  <p class="small">A small-order fee of 3.00 € is added to orders under 15 €.</p>
  <button type="button">Send order</button>
</main>
</body>
</html>
